name: Build OpenWrt + FRR (BPI-R2 Pro)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt tag (e.g. v25.12.6). Empty = latest stable release tag."
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub release (off = build artifacts only)"
        type: boolean
        default: true

permissions:
  contents: write # needed to create releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SEED_CONFIG: config/bpi-r2-pro.config
  TARGET_DIR: rockchip/armv8
  DEVICE: sinovoip_bpi-r2-pro
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350 # GitHub-hosted hard cap is 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # The runner has ~14 GB free by default; a full OpenWrt build needs ~25-30 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-pyelftools libgnutls28-dev rsync swig unzip zlib1g-dev \
            file wget zstd

      - name: Resolve OpenWrt version
        id: ver
        run: |
          v="${{ inputs.openwrt_version }}"
          if [ -z "$v" ]; then
            # Highest vX.Y.Z tag, excluding -rcN
            v=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 'v*' \
                | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          echo "OpenWrt version: $v"
          echo "openwrt=$v" >> "$GITHUB_OUTPUT"

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "${{ steps.ver.outputs.openwrt }}" \
            https://github.com/openwrt/openwrt.git openwrt

      # Release tags pin every feed to a commit in feeds.conf.default, so this is reproducible.
      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Read FRR version
        id: frr
        working-directory: openwrt
        run: |
          mk=$(find feeds -path '*/net/frr/Makefile' -o -path '*/frr/Makefile' | head -1)
          test -n "$mk" || { echo "::error::FRR package not found in any feed"; exit 1; }
          v=$(sed -n 's/^PKG_VERSION:=//p' "$mk")
          echo "FRR $v from $mk"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Generate .config
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/$SEED_CONFIG" .config
          make defconfig
          # defconfig silently drops unknown/unsatisfiable symbols. Fail loudly instead.
          missing=0
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            if ! grep -qxF "$line" .config; then
              echo "::error::Seed option did not survive defconfig: $line"
              missing=1
            fi
          done < "$GITHUB_WORKSPACE/$SEED_CONFIG"
          exit $missing

      # dl/ holds source tarballs (pure function of the config); ccache holds object files.
      # Both use run_id keys + prefix restore so each run saves an updated cache.
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.ver.outputs.openwrt }}-${{ hashFiles('config/*.config') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ steps.ver.outputs.openwrt }}-${{ hashFiles('config/*.config') }}-
            dl-${{ steps.ver.outputs.openwrt }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.DEVICE }}-${{ steps.ver.outputs.openwrt }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-${{ steps.ver.outputs.openwrt }}-
            ccache-${{ env.DEVICE }}-

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 || make download -j1 V=s
          # Drop truncated downloads so they don't poison the cache
          find dl -size -1024c -type f -delete

      - name: Build
        working-directory: openwrt
        run: |
          echo "Building with $(nproc) cores"
          if ! make -j$(($(nproc) + 1)); then
            echo "::warning::Parallel build failed, rerunning single-threaded for a readable log"
            make -j1 V=s 2>&1 | tee build-failure.log
            exit 1
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            openwrt/build-failure.log
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore

      - name: Collect outputs
        id: collect
        run: |
          bin=openwrt/bin/targets/$TARGET_DIR
          out=release
          mkdir -p $out

          ls -la "$bin"
          cp "$bin"/*"$DEVICE"* $out/
          cp "$bin"/profiles.json "$bin"/config.buildinfo "$bin"/feeds.buildinfo \
             "$bin"/version.buildinfo $out/ 2>/dev/null || true

          # Standalone FRR packages (.apk on 25.12+, .ipk on older releases)
          pkgs=$(find openwrt/bin/packages -type f \( -name 'frr*.apk' -o -name 'frr*.ipk' \))
          if [ -n "$pkgs" ]; then
            tar -czf $out/frr-${{ steps.frr.outputs.version }}-packages-aarch64_generic.tar.gz \
              --transform 's,.*/,frr-packages/,' $pkgs
          fi

          ( cd $out && sha256sum * > sha256sums )
          ls -la $out

          ls $out/*sysupgrade* >/dev/null || { echo "::error::No sysupgrade image produced"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.ver.outputs.openwrt }}-frr-${{ steps.frr.outputs.version }}-${{ env.DEVICE }}
          path: release/
          retention-days: 14

      - name: Publish release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owrt="${{ steps.ver.outputs.openwrt }}"
          frr="${{ steps.frr.outputs.version }}"
          tag="${owrt}-frr${frr}-r${{ github.run_number }}"

          manifest=$(ls release/*.manifest 2>/dev/null | head -1 || true)
          [ -n "$manifest" ] || manifest=/dev/null
          kernel=$(grep -E '^kernel ' "$manifest" | awk '{print $NF}' || true)

          {
            echo "OpenWrt **${owrt}** with **FRR ${frr}** for the Banana Pi BPI-R2 Pro (Rockchip RK3568)."
            echo
            echo "- Target: \`${TARGET_DIR}\`, profile \`${DEVICE}\`"
            echo "- Kernel: ${kernel:-unknown}"
            echo "- Built from commit ${GITHUB_SHA::7} of this repo, run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "### Flashing"
            echo "Write \`*-sysupgrade.img.gz\` to an SD card or eMMC (e.g. \`gunzip -c IMAGE | dd of=/dev/sdX bs=4M conv=fsync\`),"
            echo "or use \`sysupgrade\` from an existing OpenWrt install. Verify against \`sha256sums\`."
            echo
            echo "### FRR packages included"
            echo '```'
            grep -E '^frr' "$manifest" || true
            echo '```'
          } > notes.md

          gh release create "$tag" release/* \
            --title "OpenWrt ${owrt} + FRR ${frr} (BPI-R2 Pro)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

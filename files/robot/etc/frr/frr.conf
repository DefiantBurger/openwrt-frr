! FRR config for the ROBOT router.
! The base station's copy is files/base/etc/frr/frr.conf; keep the two in sync.
!
! lan2 = antenna link A (10.0.101.0/24), lan3 = antenna link B (10.0.102.0/24)
! br-lan = robot computers (10.0.2.0/24)
!
hostname robot-router
log syslog informational
!
! BFD sends a small packet every 300ms on each radio link. If 5 in a row are
! missed (~1.5s), OSPF drops that link and traffic moves to the other one.
! detect-multiplier is 5, not the default 3, to tolerate radio jitter.
bfd
 profile radio
  detect-multiplier 5
  receive-interval 300
  transmit-interval 300
 exit
exit
!
! Computers' subnet: advertised to the base station, but no OSPF packets sent here.
interface br-lan
 ip ospf area 0
exit
!
! point-to-point skips the DR/BDR election: there are only ever two routers
! on each radio link, and the election would delay startup by ~40s.
interface lan2
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf bfd profile radio
 no ip ospf passive
exit
!
interface lan3
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf bfd profile radio
 no ip ospf passive
exit
!
router ospf
 ospf router-id 10.0.0.2
 passive-interface default
exit
!
